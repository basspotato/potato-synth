name: Build plugin

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    # The gate: Windows 11 x64 VST3 + pluginval at strictness 10
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure (newest installed Visual Studio, x64)
        shell: pwsh
        run: |
          cmake --version
          cmake -S . -B build -A x64 *>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content configure.log -Tail 40) -join '%0A'
            Write-Output "::error title=Configure failed::$tail"
            exit 1
          }

      - name: Build VST3 (Release)
        shell: pwsh
        run: |
          cmake --build build --config Release --target PotatoSynth_VST3 --parallel *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $errs = (Select-String -Path build.log -Pattern 'error' | Select-Object -First 30 | ForEach-Object { $_.Line }) -join '%0A'
            Write-Output "::error title=Build failed::$errs"
            exit 1
          }

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Potato-Masher-VST3-Windows-x64
          path: build/PotatoSynth_artefacts/Release/VST3/
          if-no-files-found: error

      - name: Validate with pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $exe = Get-ChildItem -Path pluginval -Recurse -Filter pluginval.exe | Select-Object -First 1
          & $exe.FullName --strictness-level 10 --validate-in-process --timeout-ms 120000 --validate "build/PotatoSynth_artefacts/Release/VST3/Potato Masher.vst3" *>&1 | Tee-Object -FilePath pluginval.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content pluginval.log -Tail 40) -join '%0A'
            Write-Output "::error title=pluginval failed::$tail"
            exit 1
          }
          Write-Output "::notice title=pluginval::Passed at strictness level 10"

  linux:
    # Headless compile check, pluginval and a GUI snapshot, matching what cloud sessions run
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build xvfb libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libcurl4-openssl-dev

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPOTATO_DEV_TOOLS=ON
          cmake --build build --target PotatoSynth_VST3 PotatoSynthSnapshot PotatoSynthTests

      - name: DSP tests
        run: xvfb-run -a ./build/PotatoSynthTests

      - name: Validate with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval.zip -d pluginval
          xvfb-run -a ./pluginval/pluginval --strictness-level 10 --validate-in-process --timeout-ms 120000 \
            --validate "build/PotatoSynth_artefacts/Release/VST3/Potato Masher.vst3"

      - name: GUI snapshot
        run: xvfb-run -a ./build/PotatoSynthSnapshot gui.png

      - name: Upload GUI snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Potato-Masher-GUI-snapshot
          path: gui.png
